<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Adventure Learning Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #1a2a3a; color: #fff; text-align: center; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        /* Adventure Loading Screen */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000') center/cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10;
        }
        .adventure-title { font-size: 32px; font-weight: bold; color: #f1c40f; text-shadow: 3px 3px #d35400; margin-bottom: 20px; }
        .progress-box { width: 80%; max-width: 300px; height: 20px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; border: 2px solid #f39c12; }
        .progress-bar { width: 0%; height: 100%; background: #2ecc71; transition: width 0.1s; }

        /* Main Game Layout */
        #game-screen { display: none; width: 100%; max-width: 500px; height: 100%; flex-direction: column; justify-content: space-between; padding: 15px; }
        .mode-toggle { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .mode-btn { padding: 8px 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 20px; background: #e67e22; color: white; cursor: pointer; }
        .mode-btn.active { background: #27ae60; }

        .card-container {
            flex: 1; background: #2c3e50; border: 4px solid #f1c40f; border-radius: 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); position: relative; padding: 20px;
        }
        .letter-display { font-size: 70px; font-weight: bold; color: #f39c12; margin-bottom: 5px; }
        .word-display { font-size: 26px; color: #ecf0f1; margin-bottom: 15px; font-weight: 600; }
        .image-box { width: 180px; height: 180px; background: #fff; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 100px; }

        /* Controls */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; width: 100%; }
        .nav-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: #3498db; color: white; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #2980b9; }
        .nav-btn:active { box-shadow: 0 0; transform: translateY(4px); }
        .speak-btn { background: #e74c3c; border-radius: 30px; padding: 10px 20px; font-size: 18px; color: white; border: none; cursor: pointer; box-shadow: 0 4px #c0392b; }
        .swipe-counter { font-size: 14px; color: #bdc3c7; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Adventure Loading Screen -->
    <div id="loading-screen">
        <div class="adventure-title">🏕️ Jungle Adventure Learn 🌲</div>
        <div class="progress-box"><div class="progress-bar" id="p-bar"></div></div>
        <p style="margin-top:10px; color:#f39c12;">Loading Game...</p>
    </div>

    <!-- Main Game Area -->
    <div id="game-screen">
        <div class="mode-toggle">
            <button class="mode-btn active" id="btn-en" onclick="setMode('en')">English (A-Z)</button>
            <button class="mode-btn" id="btn-hi" onclick="setMode('hi')">हिंदी (अ-ज्ञ)</button>
        </div>

        <div class="card-container" id="swipe-zone">
            <div class="letter-display" id="letter">A</div>
            <div class="word-display" id="word">Apple</div>
            <div class="image-box" id="emoji">🍎</div>
            <div class="swipe-counter">Swipe Counter: <span id="swipe-count">0</span>/5</div>
        </div>

        <div class="controls">
            <button class="nav-btn" onclick="prevCard()">◀</button>
            <button class="speak-btn" onclick="speakCurrent()">🔊 सुनें</button>
            <button class="nav-btn" onclick="nextCard()">▶</button>
        </div>
    </div>

    <script>
        // Data for English & Hindi
        const dataEn = [
            { l: "A", w: "Apple", icon: "🍎" }, { l: "B", w: "Ball", icon: "⚽" },
            { l: "C", w: "Cat", icon: "🐱" }, { l: "D", w: "Dog", icon: "🐶" },
            { l: "E", w: "Elephant", icon: "🐘" }, { l: "F", w: "Fish", icon: "🐟" },
            { l: "G", w: "Grapes", icon: "🍇" }, { l: "H", w: "Horse", icon: "🐴" }
        ];

        const dataHi = [
            { l: "अ", w: "अनार", icon: "🍎" }, { l: "आ", w: "आम", icon: "🥭" },
            { l: "इ", w: "इमली", icon: "🟤" }, { l: "ई", w: "ईख", icon: "🎋" },
            { l: "उ", w: "उल्लू", icon: "🦉" }, { l: "क", w: "कमल", icon: "🪷" },
            { l: "ख", w: "खरगोश", icon: "🐰" }, { l: "ग", w: "गमला", icon: "🪴" }
        ];

        let currentMode = 'en';
        let currentIndex = 0;
        let swipeCount = 0;

        // Loading Screen Simulation
        window.onload = () => {
            let pBar = document.getElementById('p-bar');
            let width = 0;
            let interval = setInterval(() => {
                width += 5;
                pBar.style.width = width + '%';
                if (width >= 100) {
                    clearInterval(interval);
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'flex';
                    updateCard();
                }
            }, 80);
        };

        function setMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            swipeCount = 0;
            document.getElementById('btn-en').classList.toggle('active', mode === 'en');
            document.getElementById('btn-hi').classList.toggle('active', mode === 'hi');
            updateCard();
        }

        function updateCard() {
            let list = currentMode === 'en' ? dataEn : dataHi;
            let item = list[currentIndex];
            document.getElementById('letter').innerText = item.l;
            document.getElementById('word').innerText = item.w;
            document.getElementById('emoji').innerText = item.icon;
            document.getElementById('swipe-count').innerText = swipeCount;
            speakCurrent();
        }

        function speakCurrent() {
            let list = currentMode === 'en' ? dataEn : dataHi;
            let item = list[currentIndex];
            let text = `${item.l} for ${item.w}`;
            if (currentMode === 'hi') text = `${item.l} से ${item.w}`;

            let speech = new SpeechSynthesisUtterance(text);
            speech.lang = currentMode === 'en' ? 'en-US' : 'hi-IN';
            speech.rate = 0.8; // बोलने की स्पीड धीमी (बच्चों के लिए उपयुक्त)
            window.speechSynthesis.cancel(); // पिछली आवाज बंद करें
            window.speechSynthesis.speak(speech);
        }

        function nextCard() {
            let list = currentMode === 'en' ? dataEn : dataHi;
            currentIndex = (currentIndex + 1) % list.length;
            swipeCount = 0;
            updateCard();
        }

        function prevCard() {
            let list = currentMode === 'en' ? dataEn : dataHi;
            currentIndex = (currentIndex - 1 + list.length) % list.length;
            swipeCount = 0;
            updateCard();
        }

        // Swipe Handling (5 Swipes rule)
        let touchStartX = 0;
        const swipeZone = document.getElementById('swipe-zone');

        swipeZone.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
        swipeZone.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].clientX;
            if (Math.abs(touchStartX - touchEndX) > 40) {
                swipeCount++;
                if (swipeCount >= 5) {
                    if (touchStartX > touchEndX) nextCard();
                    else prevCard();
                } else {
                    document.getElementById('swipe-count').innerText = swipeCount;
                    speakCurrent();
                }
            }
        });
    </script>
</body>
</html>
