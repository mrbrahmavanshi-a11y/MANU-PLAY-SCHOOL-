<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Manu Play SCHOOL</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #0f172a;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            height: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #1e293b;
        }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)),
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .game-badge {
            background: #f59e0b;
            color: #78350f;
            font-weight: 900;
            font-size: clamp(12px, 3.5vw, 14px);
            padding: 6px 16px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .loading-title {
            font-size: clamp(26px, 7.5vw, 36px);
            font-weight: 900;
            color: #fef08a;
            text-shadow: 0 3px 0 #b45309, 0 6px 12px rgba(0,0,0,0.5);
            margin-bottom: 24px;
            line-height: 1.2;
        }

        .progress-container {
            width: 85%;
            max-width: 280px;
            height: 18px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #f59e0b;
            border-radius: 999px;
            padding: 2px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 999px;
            transition: width 0.1s ease;
        }

        .loading-text {
            margin-top: 12px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
        }

        /* Main Game Layout */
        #game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px) 16px;
            gap: 12px;
            height: 100%;
        }

        /* Header / Controls Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .mode-selector {
            display: flex;
            background: #0f172a;
            padding: 4px;
            border-radius: 999px;
            border: 1px solid #334155;
            flex: 1;
        }

        .mode-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 700;
            font-size: clamp(12px, 3.5vw, 14px);
            padding: 8px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #334155;
            color: #f8fafc;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* Main Flashcard Card */
        .card-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 3px solid #fbbf24;
            border-radius: 24px;
            padding: 12px;
            position: relative;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        .card-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
        }

        .letter-badge {
            font-size: clamp(48px, 14vw, 70px);
            font-weight: 900;
            color: #fbbf24;
            line-height: 1;
            text-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .word-info {
            text-align: right;
        }

        .primary-word {
            font-size: clamp(20px, 5.5vw, 28px);
            font-weight: 800;
            color: #f8fafc;
        }

        .secondary-word {
            font-size: clamp(14px, 4vw, 18px);
            font-weight: 600;
            color: #38bdf8;
        }

        /* Real Image Container */
        .image-container {
            width: 100%;
            max-width: 320px;
            flex: 1;
            max-height: 52%;
            aspect-ratio: 1 / 1;
            background: #020617;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #334155;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 6px 0;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        /* Repeat Status Badge */
        .repeat-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #f59e0b;
            color: #fef08a;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: clamp(12px, 3.5vw, 14px);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Bottom Controls */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .nav-btn {
            width: clamp(52px, 15vw, 64px);
            height: clamp(52px, 15vw, 64px);
            border-radius: 50%;
            border: none;
            background: #2563eb;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 0 #1d4ed8, 0 8px 12px rgba(0,0,0,0.3);
            cursor: pointer;
            flex-shrink: 0;
        }

        .nav-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1d4ed8, 0 4px 6px rgba(0,0,0,0.3);
        }

        .speak-btn {
            flex: 1;
            height: clamp(48px, 14vw, 58px);
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            font-size: clamp(15px, 4.2vw, 18px);
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 0 #b91c1c, 0 8px 12px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .speak-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b91c1c, 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Adventure Loading Screen -->
        <div id="loading-screen">
            <div class="game-badge">🎮 Adventure Learn</div>
            <div class="loading-title">Jungle Kids<br>Learning Game</div>
            <div class="progress-container">
                <div class="progress-bar" id="p-bar"></div>
            </div>
            <div class="loading-text" id="loading-status">Loading Game Resources...</div>
        </div>

        <!-- Main Game Area -->
        <div id="game-screen">
            <!-- Top Controls -->
            <div class="top-bar">
                <div class="mode-selector">
                    <button class="mode-btn active" id="btn-en" onclick="setMode('en')">English (A-Z)</button>
                    <button class="mode-btn" id="btn-hi" onclick="setMode('hi')">हिंदी (अ-ज्ञ)</button>
                </div>
                <button class="icon-btn" id="music-btn" onclick="toggleMusic()" title="Background Music">🎵</button>
            </div>

            <!-- Flashcard Display -->
            <div class="card-wrapper" id="swipe-zone">
                <div class="card-header">
                    <div class="letter-badge" id="letter">A</div>
                    <div class="word-info">
                        <div class="primary-word" id="primary-word">Apple</div>
                        <div class="secondary-word" id="secondary-word">सेब</div>
                    </div>
                </div>

                <div class="image-container">
                    <img id="real-img" src="" alt="Learning Object">
                </div>

                <div class="repeat-badge">
                    <span>🔁 दोहराव:</span>
                    <span id="repeat-count">1</span> / 5
                </div>
            </div>

            <!-- Bottom Control Buttons -->
            <div class="bottom-controls">
                <button class="nav-btn" onclick="prevCard()" aria-label="Previous">◀</button>
                <button class="speak-btn" onclick="manualSpeakRepeat()" aria-label="Listen Voice">
                    <span>🔊 फिर से सुनें</span>
                </button>
                <button class="nav-btn" onclick="nextCard()" aria-label="Next">▶</button>
            </div>
        </div>
    </div>

    <script>
        // High Quality Real Image Dataset with English + Hindi Translations
        const dataEn = [
            { l: "A", w: "Apple", hiW: "सेब", img: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=600&q=80" },
            { l: "B", w: "Ball", hiW: "गेंद", img: "https://images.unsplash.com/photo-1614632537190-23e4146777db?w=600&q=80" },
            { l: "C", w: "Cat", hiW: "बिल्ली", img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&q=80" },
            { l: "D", w: "Dog", hiW: "कुत्ता", img: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&q=80" },
            { l: "E", w: "Elephant", hiW: "हाथी", img: "https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=600&q=80" },
            { l: "F", w: "Fish", hiW: "मछली", img: "https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?w=600&q=80" },
            { l: "G", w: "Grapes", hiW: "अंगूर", img: "https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=600&q=80" },
            { l: "H", w: "Horse", hiW: "घोड़ा", img: "https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=600&q=80" }
        ];

        const dataHi = [
            { l: "अ", w: "अनार", hiW: "Pomegranate", img: "https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=600&q=80" },
            { l: "आ", w: "आम", hiW: "Mango", img: "https://images.unsplash.com/photo-1553279768-865429fa0078?w=600&q=80" },
            { l: "इ", w: "इमली", hiW: "Tamarind", img: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=600&q=80" },
            { l: "उ", w: "उल्लू", hiW: "Owl", img: "https://images.unsplash.com/photo-1543549790-8b5f4a028cfb?w=600&q=80" },
            { l: "क", w: "कमल", hiW: "Lotus", img: "https://images.unsplash.com/photo-1508615070457-7ba34003ab59?w=600&q=80" },
            { l: "ख", w: "खरगोश", hiW: "Rabbit", img: "https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?w=600&q=80" }
        ];

        let currentMode = 'en';
        let currentIndex = 0;
        let repeatCounter = 1;
        let repeatTimeout = null;

        // Web Audio Synthesizer for Background Music
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicTimer = null;

        window.onload = () => {
            let pBar = document.getElementById('p-bar');
            let statusText = document.getElementById('loading-status');
            let width = 0;

            let interval = setInterval(() => {
                width += 10;
                pBar.style.width = width + '%';
                if (width === 40) statusText.innerText = "Setting Up Voices...";
                if (width === 80) statusText.innerText = "Preparing Adventure Theme...";
                if (width >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                        updateCard();
                    }, 300);
                }
            }, 80);
        };

        function setMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            document.getElementById('btn-en').classList.toggle('active', mode === 'en');
            document.getElementById('btn-hi').classList.toggle('active', mode === 'hi');
            updateCard();
        }

        function updateCard() {
            stopVoiceSequence();
            let list = currentMode === 'en' ? dataEn : dataHi;
            let item = list[currentIndex];

            document.getElementById('letter').innerText = item.l;
            document.getElementById('primary-word').innerText = item.w;
            document.getElementById('secondary-word').innerText = item.hiW;
            document.getElementById('real-img').src = item.img;

            // Start 5 Times Audio Sequence
            repeatCounter = 1;
            playBilingualVoiceSequence();
        }

        function stopVoiceSequence() {
            window.speechSynthesis.cancel();
            if (repeatTimeout) {
                clearTimeout(repeatTimeout);
                repeatTimeout = null;
            }
        }

        // Bilingual Pronunciation + 5-Times Repeat Logic
        function playBilingualVoiceSequence() {
            stopVoiceSequence();
            document.getElementById('repeat-count').innerText = repeatCounter;

            let list = currentMode === 'en' ? dataEn : dataHi;
            let item = list[currentIndex];

            if (currentMode === 'en') {
                // English Mode: "A for Apple", then Hindi "A से सेब"
                let enText = `${item.l} for ${item.w}`;
                let hiText = `${item.l} से ${item.hiW}`;

                let speech1 = new SpeechSynthesisUtterance(enText);
                speech1.lang = 'en-US';
                speech1.rate = 0.85;

                let speech2 = new SpeechSynthesisUtterance(hiText);
                speech2.lang = 'hi-IN';
                speech2.rate = 0.85;

                speech1.onend = () => {
                    window.speechSynthesis.speak(speech2);
                };

                speech2.onend = () => {
                    handleRepeatNext();
                };

                window.speechSynthesis.speak(speech1);

            } else {
                // Hindi Mode: "अ से अनार"
                let hiText = `${item.l} से ${item.w}`;
                let speech = new SpeechSynthesisUtterance(hiText);
                speech.lang = 'hi-IN';
                speech.rate = 0.85;

                speech.onend = () => {
                    handleRepeatNext();
                };

                window.speechSynthesis.speak(speech);
            }
        }

        function handleRepeatNext() {
            if (repeatCounter < 5) {
                repeatCounter++;
                repeatTimeout = setTimeout(() => {
                    playBilingualVoiceSequence();
                }, 900); // 0.9 sec delay between repeats
            }
        }

        function manualSpeakRepeat() {
            repeatCounter = 1;
            playBilingualVoiceSequence();
        }

        function nextCard() {
            let list = currentMode === 'en' ? dataEn : dataHi;
            currentIndex = (currentIndex + 1) % list.length;
            updateCard();
        }

        function prevCard() {
            let list = currentMode === 'en' ? dataEn : dataHi;
            currentIndex = (currentIndex - 1 + list.length) % list.length;
            updateCard();
        }

        // Swipe Gesture Handling
        let touchStartX = 0;
        const swipeZone = document.getElementById('swipe-zone');

        swipeZone.addEventListener('touchstart', e => { 
            touchStartX = e.touches[0].clientX; 
        }, { passive: true });

        swipeZone.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].clientX;
            let diffX = touchStartX - touchEndX;

            if (Math.abs(diffX) > 40) {
                if (diffX > 0) nextCard();
                else prevCard();
            }
        }, { passive: true });

        // Background Music
        function toggleMusic() {
            let btn = document.getElementById('music-btn');
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (isMusicPlaying) {
                isMusicPlaying = false;
                btn.innerText = "🎵";
                btn.style.background = "#334155";
                if (musicTimer) clearInterval(musicTimer);
            } else {
                isMusicPlaying = true;
                btn.innerText = "🔊";
                btn.style.background = "#16a34a";
                playAdventureTune();
                musicTimer = setInterval(playAdventureTune, 4000);
            }
        }

        function playAdventureTune() {
            if (!isMusicPlaying || !audioCtx) return;
            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
            notes.forEach((freq, idx) => {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime + idx * 0.4);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.4 + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + idx * 0.4);
                osc.stop(audioCtx.currentTime + idx * 0.4 + 0.35);
            });
        }
    </script>
</body>
</html>
